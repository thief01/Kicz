services:
  backend:
    build: ./backend
    container_name: kicz-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Twitch__ClientId=${TWITCH_CLIENT_ID}
      - Twitch__ClientSecret=${TWITCH_CLIENT_SECRET}
    volumes:
      - ./data:/app/data
    networks:
      - proxy

  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${API_URL}
    container_name: kicz-frontend
    depends_on:
      - backend
    networks:
      - proxy

networks:
  proxy:
    external: true
